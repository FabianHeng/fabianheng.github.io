<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Fabian Heng | Travel Blog</title>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- CSS Pages Goes Here -->
        <link rel="stylesheet" href="css/font-awesome-4.7.0/css/font-awesome.min.css">
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="css/footer.css">
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <link rel="stylesheet" type="text/css" href="css/motion.css">
        <link rel="stylesheet" type="text/css" href="css/sep.css">
        <script type="speculationrules">
            {
                "prerender": [{
                    "where": {
                        "and": [
                            { "href_matches": "/*" },
                            { "not": { "href_matches": ["/*.pdf", "/*.md"] } },
                            { "not": { "selector_matches": "[target=_blank], [aria-current=page]" } }
                        ]
                    },
                    "eagerness": "moderate"
                }]
            }
        </script>
        <script>
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('motion');
                setTimeout(function() {
                    if (!window.Motion) document.documentElement.classList.remove('motion');
                }, 3000);
            }
        </script>

        <!-- Favicon Goes Here -->
        <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
        <link rel="Favicon Icon" href="img/favicon/favicon.ico">
    </head>
    <body>
        <!-- Scroll to top button -->
        <button class="scroll-top-btn">
            <i class="fa fa-chevron-up"></i>
        </button>

        <div class="trip-progress"><span></span></div>

        <div class="trip-page">
            <!-- Hero Section -->
            <header class="trip-hero">
                <div class="trip-hero-media"><img id="trip-hero-img" alt="" fetchpriority="high"></div>
                <div class="trip-hero-shade"></div>
                <a href="life.html#sep" class="trip-back" data-hero style="--d: 600ms"><i class="fa fa-long-arrow-left"></i> All stops</a>
                <div class="trip-hero-content">
                    <div class="trip-kicker" id="trip-kicker" data-hero style="--d: 150ms"></div>
                    <h1 id="trip-title" data-hero style="--d: 280ms"></h1>
                    <div class="trip-hero-meta" data-hero style="--d: 420ms">
                        <span><i class="fa fa-map-marker"></i><span id="trip-location"></span></span>
                        <span><i class="fa fa-calendar-o"></i><span id="trip-date"></span></span>
                    </div>
                </div>
                <div class="trip-scroll-cue" data-hero style="--d: 800ms">Scroll</div>
            </header>

            <!-- Chapter Index -->
            <div class="trip-intro" data-reveal style="--reveal-y: 24px">
                <span class="trip-intro-label">In this stop</span>
                <ul class="trip-chapter-list" id="trip-chapter-list"></ul>
            </div>

            <!-- Chapters -->
            <main class="trip-chapters" id="trip-chapters"></main>

            <!-- Next Trip -->
            <div class="trip-next" id="trip-next"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
        <script type="text/javascript" src="js/scroll.js"></script>
        <script src="js/sep.js"></script>
        <script src="js/trip.js"></script>
        <script src="js/motion.js"></script>
    </body>
    
    <!-- Footer Section -->
    <footer class="small-font">
        <div class="social">
            <div class="icons">
                <h3 class="big-font">Social<span class="period">.</span></h3>
                <ul class="social-icons">
                    <a href="https://github.com/FabianHeng/" target="_blank"><li><i class="fa fa-github"></i></li></a>
                    <a href="https://www.linkedin.com/in/fabianheng/" target="_blank"><li><i class="fa fa-linkedin"></i></li></a>
                    <a href="https://www.instagram.com/f.fl.b/" target="_blank"><li><i class="fa fa-instagram"></i></li></a>
                    <a href="https://www.youtube.com/c/Entertainium/" target="_blank"><li><i class="fa fa-youtube"></i></li></a>
                </ul>
            </div>
            <div class="email">
                <span><i class="fa fa-envelope"></i><a href="mailto:fabianheng@gmail.com">fabianheng@gmail.com</a></span>
                <span><i class="fa fa-building"></i><a href="https://appsol.sg">founder @ Appsol</a></span>
                <span><i class="fa fa-file-text"></i><a href="cv.html">curriculum vitae</a></span>
            </div>
        </div>
        <img src="img/fab.webp">
        <div class="copyright">
            <p>Made by Fabian Heng &copy; 2026</p>
            <p>Miss my old webpage? You can still access it by clicking <a href="https://fabianheng.github.io/prev/prev.html">here</a>.</p>
        </div>

</html>
