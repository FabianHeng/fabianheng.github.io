        <script type="speculationrules">
            {
                "prerender": [{
                    "where": {
                        "and": [
                            { "href_matches": "/*" },
                            { "not": { "href_matches": ["/*.pdf", "/*.md"] } },
                            { "not": { "selector_matches": "[target=_blank], [aria-current=page]" } }
                        ]
                    },
                    "eagerness": "moderate"
                }]
            }
        </script>
        <script>
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('motion');
                setTimeout(function() {
                    if (!window.Motion) document.documentElement.classList.remove('motion');
                }, 3000);
            }
        </script>
